# Example configuration entry
esphome:
  name: sdl
  on_boot:
    - then:
      - script.execute: update_ui_visibility

api:

host:

logger:
  level: DEBUG
  logs:
    component: ERROR

packages:
  - !include includes/fonts.yaml
  - !include includes/globals.yaml
  - !include includes/ui_common.yaml
  - !include includes/scripts_sdl.yaml

# Mock light for SDL
light:
  - platform: binary
    output: mock_output
    name: "Inkplate Frontlight"
    id: inkplate_light

output:
  - platform: template
    id: mock_output
    type: binary
    write_action:
      - lambda: |-
          // Mock output - do nothing

# Mock sun elevation sensor
sensor:
  - platform: template
    id: sun_elevation
    name: "Sun Elevation"
  # Mock alarmo delay sensor
  - platform: template
    id: alarmo_delay
    name: "Alarmo Delay"

# SDL debug controls as top layer overlay
lvgl:
  top_layer:
    widgets:
      - obj:
          id: debug_bar
          x: 0
          y: 698
          width: 1024
          height: 60
          bg_color: 0x404040
          clickable: false
          widgets:
            - button:
                x: 10
                y: 5
                width: 200
                height: 50
                on_press:
                  - lambda: |-
                      id(alarmo_state) = "disarmed";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "DISARMED"
                      align: CENTER
            - button:
                x: 220
                y: 5
                width: 200
                height: 50
                on_press:
                  - lambda: |-
                      id(alarmo_state) = "armed_away";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "ARMED AWAY"
                      align: CENTER
            - button:
                x: 430
                y: 5
                width: 200
                height: 50
                on_press:
                  - lambda: |-
                      id(alarmo_state) = "armed_home";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "ARMED HOME"
                      align: CENTER
            - button:
                x: 640
                y: 5
                width: 174
                height: 50
                on_press:
                  - lambda: |-
                      id(alarmo_state) = "arming";
                      id(local_countdown) = 15;
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "ARMING"
                      align: CENTER

display:
  - platform: sdl
    id: inkplate_display
    dimensions:
      width: 1024
      height: 758

touchscreen:
  - platform: sdl
    display: inkplate_display
