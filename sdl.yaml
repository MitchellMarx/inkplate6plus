# Minimal placeholders for SDL testing
globals:
  - id: entered_pin
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: invalid_flag
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: local_countdown
    type: int
    restore_value: no
    initial_value: '0'

  - id: show_error
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: show_connection_error
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: light_timeout
    type: int
    restore_value: no
    initial_value: '0'

  - id: alarmo_state
    type: std::string
    restore_value: no
    initial_value: '"disarmed"'

text_sensor:
  - platform: homeassistant
    id: alarmo_entity
    entity_id: alarm_control_panel.alarmo
    on_value:
      then:
        - lambda: |-
            // Mirror HA alarm state into a local global so it can be overridden for testing
            id(alarmo_state) = std::string(x);
        - script.execute: update_ui_visibility

sensor:
  - platform: homeassistant
    id: alarmo_delay
    entity_id: alarm_control_panel.alarmo
    attribute: delay
    unit_of_measurement: 's'

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Sync local_countdown from the Alarmo delay attribute (if available)
          {
            float v = id(alarmo_delay).state;
            if (v == v) {
              id(local_countdown) = (int)(v + 0.5);
            } else {
              id(local_countdown) = 0;
            }
          }
      - lvgl.widget.redraw: status_left_label
      - lvgl.widget.redraw: pin_label

script:
  - id: update_ui_visibility
    then:
      - if:
          condition:
            lambda: 'return (id(alarmo_state) == "unknown") || (id(alarmo_state) == "unavailable");'
          then:
            - lvgl.page.show: status_unknown_page
            - lvgl.widget.redraw: status_unknown_label
          else:
            - if:
                condition:
                  lambda: 'return id(alarmo_state) == "disarmed";'
                then:
                  - lvgl.page.show: disarmed_page
                  - lvgl.widget.redraw: arm_away_label
                  - lvgl.widget.redraw: arm_home_label
                else:
                  - lvgl.page.show: armed_page
                  - lvgl.widget.redraw: status_left_label
                  - lvgl.widget.redraw: pin_label
  - id: arm_away_script
    then:
      - homeassistant.service:
          service: alarmo.arm
          data:
            mode: away
            entity_id: alarm_control_panel.alarmo

  - id: arm_home_script
    then:
      - homeassistant.service:
          service: alarmo.arm
          data:
            mode: home
            entity_id: alarm_control_panel.alarmo

  - id: submit_pin_script
    then:
      - homeassistant.service:
          service: alarmo.disarm
          data:
            entity_id: alarm_control_panel.alarmo
            code: !lambda 'return id(entered_pin);'
      - delay: 1s
      - lambda: |-
          // If Alarmo didn't switch to 'disarmed' shortly after the service call,
          // show INVALID for 2s and clear entered PIN.
          if (id(alarmo_state) != "disarmed") {
            id(invalid_flag) = true;
          } else {
            id(entered_pin) = "";
          }
      - if:
          condition:
            lambda: 'return id(invalid_flag);'
          then:
            - lvgl.widget.redraw: pin_label
            - delay: 2s
            - lambda: |-
                id(invalid_flag) = false;
                id(entered_pin) = "";
