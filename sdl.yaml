# Example configuration entry
esphome:
  name: sdl
  on_boot:
    - then:
      - script.execute: update_ui_visibility

api:

host:

display:
  - platform: sdl
    id: inkplate_display
    dimensions:
      width: 1024
      height: 758

lvgl:
  displays:
    - inkplate_display
  buffer_size: 25%
  default_font: montserrat_18
  pages:
    - id: status_unknown_page
      widgets:
        - label:
            id: status_unknown_label
            text_align: CENTER
            text_font: montserrat_43
            text: "CONNECTING..."
            width: 1011
            height: 758
            pad_top: 358

    - id: disarmed_page
      widgets:
        - button:
            id: arm_away_btn
            x: 51
            y: 253
            width: 441
            height: 253
            on_press:
              then:
                - script.execute: arm_away_script
            widgets:
              - label:
                  id: arm_away_label
                  x: 0
                  y: 0
                  width: 441
                  height: 253
                  align: CENTER
                  text_font: font_button_large
                  text: "ARM AWAY"
                  text_align: CENTER
                  pad_top: 86

        - button:
            id: arm_home_btn
            x: 518
            y: 253
            width: 441
            height: 253
            on_press:
              then:
                - script.execute: arm_home_script
            widgets:
              - label:
                  id: arm_home_label
                  x: 0
                  y: 0
                  width: 441
                  height: 253
                  align: CENTER
                  text_font: font_button_large
                  text: "ARM STAY"
                  text_align: CENTER
                  pad_top: 86

    - id: armed_page
      widgets:
        - label:
            id: status_left_label
            x: 25
            y: 101
            width: 278
            height: 152
            text_align: CENTER
            text_font: montserrat_43
            text: !lambda |-
              std::string s = id(alarmo_state);
              if (s == "arming") {
                char buf[64];
                sprintf(buf, "ARMING (%ds)", id(local_countdown));
                return std::string(buf);
              }
              if (s == "armed_home")
                return std::string("ARMED HOME");
              if (s == "armed_away")
                return std::string("ARMED AWAY");
              if (s == "armed_night")
                return std::string("ARMED NIGHT");
              return std::string("OOPS");

        - label:
            id: pin_label
            x: 328
            y: 88
            width: 657
            height: 71
            text_align: CENTER
            text_font: montserrat_35
            text: !lambda |-
              if (id(invalid_flag)) return std::string("INVALID");
              std::string s = "";
              for (int i = 0; i < id(entered_pin).length(); i++) s += "●";
              if (s.size() == 0) s = "";
              return s;

        - button:
            id: btn_1
            x: 341
            y: 177
            width: 152
            height: 152
            on_press:
              then:
                - lambda: |-
                    if (id(entered_pin).length() < 6) id(entered_pin) += "1";
                - lvgl.widget.redraw: pin_label
            widgets:
