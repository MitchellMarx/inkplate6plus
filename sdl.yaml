# Example configuration entry
esphome:
  name: sdl
  on_boot:
    - then:
      # No Home Assistant in the simulator: pretend it is connected and start
      # disarmed. Use the debug bar to drive the other states.
      - lambda: |-
          id(ha_connected_flag) = true;
          id(alarmo_state) = "disarmed";
      - script.execute: update_ui_visibility
    # Read the LVGL input device every 10 ms instead of the default (16 ms in
    # LVGL 9), so a touch state that the SDL touchscreen holds for one 20 ms poll
    # (see below) is always observed by LVGL.
    - priority: -100
      then:
        - lambda: |-
            lv_timer_set_period(lv_indev_get_read_timer(lv_indev_get_next(nullptr)), 10);
        # Must run after LvglComponent::setup has created the buttons.
        - script.execute: strip_button_pressed_styles
        - script.execute: update_ui_visibility

# Local override of the stock ESPHome sdl component, see components/sdl/.
# Measured on the stock component with synthetic clicks every 100 ms:
#   * 10 ms clicks: ~75% never seen, because the touchscreen only samples the
#     mouse button level every 50 ms.
#   * 60 ms clicks: bursts of 3-4 consecutive clicks merged into one press when
#     the 40 ms gap between clicks fell between two polls.
#   * mouse motion: only one SDL event is drained per 16 ms main-loop iteration,
#     so a moving mouse backs up the queue and button events arrive late.
# The override drains all events per iteration and queues every button
# transition so the touchscreen consumes exactly one per poll.
external_components:
  - source:
      type: local
      path: components
    components: [sdl]

api:

host:

logger:
  level: DEBUG
  logs:
    component: ERROR

packages:
  - !include includes/fonts.yaml
  - !include includes/globals.yaml
  - !include includes/ui_common.yaml
  - !include includes/scripts_sdl.yaml

# Mock light for SDL
light:
  - platform: binary
    output: mock_output
    name: "Inkplate Frontlight"
    id: inkplate_light

output:
  - platform: template
    id: mock_output
    type: binary
    write_action:
      - lambda: |-
          // Mock output - do nothing

# Mock sun elevation sensor
sensor:
  - platform: template
    id: sun_elevation
    name: "Sun Elevation"
  # Mock alarmo delay sensor
  - platform: template
    id: alarmo_delay
    name: "Alarmo Delay"

# SDL debug controls as top layer overlay
lvgl:
  top_layer:
    widgets:
      - obj:
          id: debug_bar
          x: 0
          y: 638
          width: 1024
          height: 120
          bg_color: 0x404040
          clickable: false
          # Keep every debug button fully visible and fixed in place: with the
          # default padding the content overflowed and the bar scrolled on the
          # first click, which swallowed that click and moved the buttons.
          scrollable: false
          pad_all: 2
          widgets:
            # First row
            - button:
                x: 5
                y: 5
                width: 155
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "disarmed";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "DISARMED"
                      align: CENTER
            - button:
                x: 165
                y: 5
                width: 155
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "armed_away";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "AWAY"
                      align: CENTER
            - button:
                x: 325
                y: 5
                width: 155
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "armed_home";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "HOME"
                      align: CENTER
            - button:
                x: 485
                y: 5
                width: 155
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "armed_night";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "NIGHT"
                      align: CENTER
            - button:
                x: 645
                y: 5
                width: 155
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "armed_vacation";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "VACATION"
                      align: CENTER
            - button:
                x: 805
                y: 5
                width: 214
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "armed_custom_bypass";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "CUSTOM"
                      align: CENTER
            # Second row
            - button:
                x: 5
                y: 60
                width: 200
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "arming";
                      id(local_countdown) = 15;
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "ARMING"
                      align: CENTER
            - button:
                x: 210
                y: 60
                width: 200
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "pending";
                      id(local_countdown) = 15;
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "PENDING"
                      align: CENTER
            - button:
                x: 415
                y: 60
                width: 200
                height: 50
                on_click:
                  - lambda: |-
                      id(alarmo_state) = "triggered";
                  - script.execute: update_ui_visibility
                widgets:
                  - label:
                      text: "TRIGGERED"
                      align: CENTER
            - button:
                x: 620
                y: 60
                width: 200
                height: 50
                on_click:
                  - lambda: |-
                      if (id(open_sensors_list) == "") {
                        // Same shape as HA's "Alarmo Open Sensor Names" template sensor.
                        id(open_sensors_list) = "Back Door, Garage Window";
                      } else {
                        id(open_sensors_list) = "";
                      }
                      id(arm_error) = false;
                  - lvgl.widget.refresh: sensors_toggle_label
                  - lvgl.widget.redraw: sensors_toggle_label
                  - lvgl.widget.refresh: disarmed_status_label
                  - lvgl.widget.redraw: disarmed_status_label
                widgets:
                  - label:
                      id: sensors_toggle_label
                      text: !lambda |-
                        if (id(open_sensors_list) == "") {
                          return std::string("SENSORS: CLEAR");
                        } else {
                          return std::string("SENSORS: OPEN");
                        }
                      align: CENTER

display:
  - platform: sdl
    id: inkplate_display
    dimensions:
      width: 1024
      height: 758

touchscreen:
  - platform: sdl
    display: inkplate_display
    id: touch_input
    # One queued button transition is consumed per poll (see components/sdl),
    # so this sets the maximum click rate: 20 ms -> 25 clicks/s.
    update_interval: 20ms
