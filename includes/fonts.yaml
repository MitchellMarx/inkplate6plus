# Bold cuts: in 1-bit mode the anti-aliased edge pixels render white, which
# thins every stroke by about a pixel on each side.
font:
  - file: "gfonts://Montserrat@700"
    id: montserrat_18
    size: 18
  - file: "gfonts://Montserrat@700"
    id: montserrat_35
    size: 35
  - file: "gfonts://Montserrat@700"
    id: montserrat_43
    size: 43
  - file: "gfonts://Roboto"
    id: font_medium
    size: 30
  - file: "gfonts://Roboto"
    id: font_large
    size: 45
  - file: "gfonts://Roboto@700"
    id: font_title
    size: 45
  - file: "gfonts://Roboto@700"
    id: font_status
    size: 35
  - file: "gfonts://Roboto@700"
    id: font_button
    size: 33
  - file: "gfonts://Roboto@700"
    id: font_button_large
    size: 81
