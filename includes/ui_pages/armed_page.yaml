id: armed_page
widgets:
  - label:
      id: status_left_label
      x: 25
      y: 101
      width: 278
      height: 152
      text_align: CENTER
      text_font: montserrat_43
      text: !lambda |-
        std::string s = id(alarmo_state);
        if (s == "arming") {
          char buf[64];
          sprintf(buf, "ARMING (%ds)", id(local_countdown));
          return std::string(buf);
        }
        if (s == "armed_home")
          return std::string("ARMED HOME");
        if (s == "armed_away")
          return std::string("ARMED AWAY");
        if (s == "armed_night")
          return std::string("ARMED NIGHT");
        return std::string("OOPS");

  - label:
      id: pin_label
      x: 328
      y: 88
      width: 657
      height: 71
      text_align: CENTER
      text_font: montserrat_35
      text: !lambda |-
        if (id(invalid_flag)) return std::string("INVALID");
        std::string s = "";
        for (int i = 0; i < id(entered_pin).length(); i++) s += "●";
        if (s.size() == 0) s = "";
        return s;

  - button:
      id: btn_1
      x: 341
      y: 177
      width: 152
      height: 152
      on_press:
        then:
            - lambda: |-
                if (id(entered_pin).length() < 6) id(entered_pin) += "1";
            - lvgl.widget.redraw: pin_label
            - lambda: |-
                id(inkplate_display).update();
      widgets:
        - label:
            id: btn_1_label
            x: 0
            y: 0
            width: 152
            height: 152
            align: CENTER
            text: '1'
            text_font: montserrat_43
            text_align: CENTER
            pad_top: 53

