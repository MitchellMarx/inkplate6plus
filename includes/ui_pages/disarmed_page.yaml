id: disarmed_page
widgets:
  # Why the last arm attempt failed. Empty when there is nothing to report.
  - label:
      id: disarmed_status_label
      x: 25
      y: 70
      width: 974
      height: 160
      text_align: CENTER
      text_font: montserrat_35
      long_mode: WRAP
      text: !lambda |-
        // open_sensors_list holds the friendly names, comma separated (see
        // scripts_hardware.yaml), or "" when nothing blocked the last arm.
        if (!id(open_sensors_list).empty())
          return std::string("CANNOT ARM, OPEN: ") + id(open_sensors_list);
        if (id(arm_error))
          return std::string("ARM REQUEST FAILED\nCHECK HOME ASSISTANT / ALARMO");
        return std::string("");

  - button:
      id: arm_away_btn
      x: 51
      y: 253
      width: 441
      height: 253
      on_click:
        then:
          - script.execute: arm_away_script
      widgets:
        - label:
            id: arm_away_label
            x: 0
            y: 0
            width: 441
            height: 253
            align: CENTER
            text_font: font_button_large
            text: "ARM AWAY"
            text_align: CENTER
            pad_top: 86

  - button:
      id: arm_home_btn
      x: 518
      y: 253
      width: 441
      height: 253
      on_click:
        then:
          - script.execute: arm_home_script
      widgets:
        - label:
            id: arm_home_label
            x: 0
            y: 0
            width: 441
            height: 253
            align: CENTER
            text_font: font_button_large
            text: "ARM STAY"
            text_align: CENTER
            pad_top: 86
