script:
  - id: arm_away_script
    mode: restart
    then:
      - logger.log: "UI: ARM AWAY script triggered"
      - lambda: |-
          id(arm_error) = false;
      - lvgl.widget.refresh: disarmed_status_label
      - lvgl.widget.redraw: disarmed_status_label
      - homeassistant.service:
          service: alarmo.arm
          data:
            mode: away
            entity_id: alarm_control_panel.alarmo
      - script.execute: check_arm_result

  - id: arm_home_script
    mode: restart
    then:
      - logger.log: "UI: ARM HOME script triggered"
      - lambda: |-
          id(arm_error) = false;
      - lvgl.widget.refresh: disarmed_status_label
      - lvgl.widget.redraw: disarmed_status_label
      - homeassistant.service:
          service: alarmo.arm
          data:
            mode: home
            entity_id: alarm_control_panel.alarmo
      - script.execute: check_arm_result

  - id: submit_pin_script
    then:
      - logger.log:
          format: "UI: OK pressed with %u digits, calling alarmo.disarm"
          args: ['(unsigned) id(entered_pin).length()']
      # Alarmo validates the code itself (its "use disarm code" setting must be on).
      - homeassistant.service:
          service: alarmo.disarm
          data:
            entity_id: alarm_control_panel.alarmo
            code: !lambda 'return id(entered_pin);'
      - delay: 1s
      - lambda: |-
          // If Alarmo didn't switch to 'disarmed' shortly after the service call,
          // show INVALID for 2s and clear entered PIN.
          if (id(alarmo_state) != "disarmed") {
            id(invalid_flag) = true;
          } else {
            id(entered_pin) = "";
          }
      - if:
          condition:
            lambda: 'return id(invalid_flag);'
          then:
            - lvgl.widget.refresh: pin_label
            - lvgl.widget.redraw: pin_label
            - delay: 2s
            - lambda: |-
                id(invalid_flag) = false;
                id(entered_pin) = "";
            - lvgl.widget.refresh: pin_label
            - lvgl.widget.redraw: pin_label

