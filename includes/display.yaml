output:
  - platform: gpio
    pin:
      pca6416a: pca6416a_hub
      number: 11
    id: frontlight_output

light:
  - platform: binary
    output: frontlight_output
    name: "Inkplate Frontlight"
    id: inkplate_light
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: inkplate
    id: inkplate_display
    greyscale: true
    partial_updating: false
    update_interval: never
    model: inkplate_6_plus
    
    # Required pin definitions for Inkplate 6 Plus
    ckv_pin: GPIO32
    sph_pin: GPIO33
    gmod_pin:
      pca6416a: pca6416a_hub
      number: 1
    gpio0_enable_pin:
      pca6416a: pca6416a_hub
      number: 8
    oe_pin:
      pca6416a: pca6416a_hub
      number: 0
    spv_pin:
      pca6416a: pca6416a_hub
      number: 2
    powerup_pin:
      pca6416a: pca6416a_hub
      number: 4
    wakeup_pin:
      pca6416a: pca6416a_hub
      number: 3
    vcom_pin:
      pca6416a: pca6416a_hub
      number: 5
    
    auto_clear_enabled: false
