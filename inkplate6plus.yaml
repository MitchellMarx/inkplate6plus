packages:
  - !include includes/hardware.yaml
  - !include includes/display.yaml
  - !include includes/fonts.yaml
  - !include includes/globals.yaml
  - !include includes/ui_common.yaml
  - !include includes/scripts_hardware.yaml
  - !include includes/touchscreen.yaml
  - !include includes/sensors_time.yaml

esphome:
  name: inkplate-alarm-panel
  on_boot:
    then:
      - delay: 5s
      - script.execute: update_ui_visibility

lvgl:
  on_draw_end:
    component.update: inkplate_display
  on_resume:
    lambda: |-
      auto call = id(inkplate_light).turn_on();
      call.perform();
  on_pause:
    lambda: |-
      auto call = id(inkplate_light).turn_off();
      call.perform();