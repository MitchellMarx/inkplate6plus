# Touchscreen - EKTF2232 for this Inkplate 6 Plus model
switch:
  - platform: gpio
    name: 'Inkplate Touchscreen Enabled'
    restore_mode: ALWAYS_ON
    pin:
      pca6416a: pca6416a_hub
      number: 12
      inverted: true

touchscreen:
  platform: ektf2232
  id: touch_input
  interrupt_pin: 36
  reset_pin:
    pca6416a: pca6416a_hub
    number: 10
  i2c_id: i2c_bus
  
  # on_touch:
  #   - script.execute: handle_touch_light

# Enable time component
time:
  - platform: homeassistant
    id: ha_time

# Sun component
sun:
  latitude: 47.7511
  longitude: -122.1245

# Binary sensor for connection status
binary_sensor:
  - platform: status
    id: ha_connected
    name: "Inkplate Connection Status"

# Sun elevation sensor
sensor:
  - platform: sun
    id: sun_elevation
    name: Sun Elevation
    type: elevation
  - platform: homeassistant
    id: alarmo_delay
    entity_id: alarm_control_panel.alarmo
    attribute: delay
    unit_of_measurement: 's'

# Global variables
globals:
  - id: entered_pin
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: invalid_flag
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: local_countdown
    type: int
    restore_value: no
    initial_value: '0'

  - id: show_error
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: show_connection_error
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: light_timeout
    type: int
    restore_value: no
    initial_value: '0'

  - id: alarmo_state
    type: std::string
    restore_value: no
    initial_value: '"disarmed"'
  

text_sensor:
  - platform: homeassistant
    id: alarmo_entity
    entity_id: alarm_control_panel.alarmo
    on_value:
      then:
        - lambda: |-
            // Mirror HA alarm state into a local global so it can be overridden for testing
            id(alarmo_state) = std::string(x);
        - script.execute: update_ui_visibility

# Interval for light timeout
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(light_timeout) > 0;'
          then:
            - lambda: |-
                id(light_timeout)--;
                if (id(light_timeout) == 0) {
                  auto call = id(inkplate_light).turn_off();
                  call.perform();
                }

# Scripts
script:
  - id: handle_touch_light
    then:
      - logger.log: "UI: touch handler triggered"
      - lambda: |-
          if (id(sun_elevation).state > 0) {
            auto call = id(inkplate_light).turn_off();
            call.perform();
            id(light_timeout) = 0;
          } else {
            auto call = id(inkplate_light).turn_on();
            call.perform();
            id(light_timeout) = 5;
          }
  - id: update_ui_visibility
    then:
      - if:
          condition:
            lambda: 'return (id(alarmo_state) == "unknown") || (id(alarmo_state) == "unavailable");'
          then:
            - lvgl.page.show: status_unknown_page
            - lvgl.widget.redraw: status_unknown_label
            - lambda: |-
                id(inkplate_display).update();
          else:
            - if:
                condition:
                  lambda: 'return id(alarmo_state) == "disarmed";'
                then:
                  - lvgl.page.show: disarmed_page
                  - lvgl.widget.redraw: arm_away_label
                  - lvgl.widget.redraw: arm_home_label
                  - lambda: |-
                      id(inkplate_display).update();
                else:
                  - lvgl.page.show: armed_page
                  - lvgl.widget.redraw: status_left_label
                  - lvgl.widget.redraw: pin_label
                  - lambda: |-
                      id(inkplate_display).update();
  - id: arm_away_script
    then:
      - logger.log: "UI: ARM AWAY script triggered"
      - homeassistant.service:
          service: alarmo.arm
          data:
            mode: away
            entity_id: alarm_control_panel.alarmo

  - id: arm_home_script
    then:
      - logger.log: "UI: ARM HOME script triggered"
      - homeassistant.service:
          service: alarmo.arm
          data:
            mode: home
            entity_id: alarm_control_panel.alarmo

  - id: submit_pin_script
    then:
      - homeassistant.service:
          service: alarmo.disarm
          data:
            entity_id: alarm_control_panel.alarmo
            code: !lambda 'return id(entered_pin);'
      - delay: 1s
      - lambda: |-
          // If Alarmo didn't switch to 'disarmed' shortly after the service call,
          // show INVALID for 2s and clear entered PIN.
          if (id(alarmo_state) != "disarmed") {
            id(invalid_flag) = true;
          } else {
            id(entered_pin) = "";
          }
      - if:
          condition:
            lambda: 'return id(invalid_flag);'
          then:
            - lvgl.widget.redraw: pin_label
            - lambda: |-
                id(inkplate_display).update();
            - delay: 2s
            - lambda: |-
                id(invalid_flag) = false;
                id(entered_pin) = "";
