esphome:
  name: inkplate-alarm-panel
  on_boot:
    then:
      - delay: 5s
      - script.execute: update_ui_visibility

esp32:
  board: esp-wrover-kit
  framework:
    type: arduino
  variant: esp32
  cpu_frequency: 240MHz

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "0tN1NmkXjS+0UHmOd8sd7k5T7EbagXmPHxFXmAZo+zg="

ota:
  platform: esphome
  password: "inkplate_ota_pass_2024"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  ap:
    ssid: "Inkplate-Alarm Fallback"

captive_portal:

# PSRAM configuration required for Inkplate display
psram:
  mode: quad
  speed: 80MHz

# I2C configuration for PCA6416A GPIO expander
i2c:
  - id: i2c_bus
    sda: GPIO21
    scl: GPIO22
    scan: true

# Inkplate 6 Plus configuration - Uses PCA6416A not MCP23017
pca6416a:
  - id: pca6416a_hub
    address: 0x20

# Frontlight control
output:
  - platform: gpio
    pin:
      pca6416a: pca6416a_hub
      number: 11
    id: frontlight_output

light:
  - platform: binary
    output: frontlight_output
    name: "Inkplate Frontlight"
    id: inkplate_light
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: inkplate
    id: inkplate_display
    greyscale: true
    partial_updating: true
    update_interval: never
    model: inkplate_6_plus
    
    # Required pin definitions for Inkplate 6 Plus
    ckv_pin: GPIO32
    sph_pin: GPIO33
    gmod_pin:
      pca6416a: pca6416a_hub
      number: 1
    gpio0_enable_pin:
      pca6416a: pca6416a_hub
      number: 8
    oe_pin:
      pca6416a: pca6416a_hub
      number: 0
    spv_pin:
      pca6416a: pca6416a_hub
      number: 2
    powerup_pin:
      pca6416a: pca6416a_hub
      number: 4
    wakeup_pin:
      pca6416a: pca6416a_hub
      number: 3
    vcom_pin:
      pca6416a: pca6416a_hub
      number: 5
    
    auto_clear_enabled: false

lvgl:
  displays:
    - inkplate_display
  buffer_size: 25%
  default_font: montserrat_18
  pages:
    - id: status_unknown_page
      widgets:
        - label:
            id: status_unknown_label
            text_align: CENTER
            text_font: montserrat_43
            text: "CONNECTING..."
            width: 1024
            height: 758
            pad_top: 358

    - id: disarmed_page
      widgets:
        - button:
            id: arm_away_btn
            x: 51
            y: 253
            width: 441
            height: 253
            on_press:
              then:
                - script.execute: arm_away_script
            widgets:
              - label:
                  id: arm_away_label
                  x: 0
                  y: 0
                  width: 441
                  height: 253
                  align: CENTER
                  text_font: font_button_large
                  text: "ARM AWAY"
                  text_align: CENTER
                  pad_top: 86

        - button:
            id: arm_home_btn
            x: 518
            y: 253
            width: 441
            height: 253
            on_press:
              then:
                - script.execute: arm_home_script
            widgets:
              - label:
                  id: arm_home_label
                  x: 0
                  y: 0
                  width: 441
                  height: 253
                  align: CENTER
                  text_font: font_button_large
                  text: "ARM STAY"
                  text_align: CENTER
                  pad_top: 86

    - id: armed_page
      widgets:
        - label:
            id: status_left_label
            x: 25
            y: 101
            width: 278
            height: 152
            text_align: CENTER
            text_font: montserrat_43
            text: !lambda |-
              std::string s = id(alarmo_state);
              if (s == "arming") {
                char buf[64];
                sprintf(buf, "ARMING (%ds)", id(local_countdown));
                return std::string(buf);
              }
              if (s == "armed_home")
                return std::string("ARMED HOME");
              if (s == "armed_away")
                return std::string("ARMED AWAY");
              if (s == "armed_night")
                return std::string("ARMED NIGHT");
              return std::string("OOPS");

        - label:
